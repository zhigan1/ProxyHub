<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxyHub 控制台</title>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2330;--line:#2d333b;
  --fg:#e6edf3;--dim:#8b949e;--dim2:#6e7681;
  --acc:#4f8cc9;--ok:#3fb950;--warn:#d29922;--err:#f85149;
  --mono:ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:19px;font-weight:600}
header .sub{color:var(--dim);font-size:12px}
header .spacer{flex:1}
button{background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc)}
button.primary{background:#2b4a6e;border-color:var(--acc)}
button.danger{border-color:var(--err);color:var(--err)}
button.small{padding:2px 10px;font-size:12px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 16px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;font-size:13px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--acc)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;gap:12px}
.grid.c4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.stat .v{font-size:24px;font-weight:700;font-family:var(--mono)}
.stat .k{color:var(--dim);font-size:12px}
.stat.ok .v{color:var(--ok)} .stat.err .v{color:var(--err)} .stat.warn .v{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #21262d;vertical-align:top}
tr:hover td{background:#1a2029}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.err{color:var(--err);border-color:var(--err)}
.pill.warn{color:var(--warn);border-color:var(--warn)} .pill.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
label{color:var(--dim);font-size:12px}
.hint{color:var(--dim2);font-size:12px}
#keybar{position:fixed;inset:0;background:rgba(13,17,23,.96);display:flex;align-items:center;justify-content:center;z-index:99}
#keybar .box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:28px;width:360px}
#keybar h2{font-size:16px;margin-bottom:6px}
#keybar p{color:var(--dim);font-size:12px;margin-bottom:14px}
#keybar input{width:100%;margin-bottom:12px}
canvas{width:100%;height:160px;background:var(--bg3);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:22px;width:520px;max-height:86vh;overflow:auto}
.modal h2{font-size:15px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px}
.field input{width:100%}
.preview{background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;color:var(--dim);max-height:180px;overflow:auto;margin-top:6px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--ok);color:var(--ok);padding:8px 16px;border-radius:6px;font-size:13px;z-index:98;animation:fade 3s forwards}
.toast.err{border-color:var(--err);color:var(--err)}
@keyframes fade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.hidden{display:none!important}
code{background:var(--bg3);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:12px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:420px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

<div id="keybar" class="hidden">
  <div class="box">
    <h2>ProxyHub 控制台</h2>
    <p>本网关已启用鉴权，请输入 proxy key（与 OpenAI API 调用使用的密钥相同）。</p>
    <input id="keyinput" type="password" placeholder="proxy key" autofocus>
    <button class="primary" style="width:100%" onclick="saveKey()">进入控制台</button>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>ProxyHub 控制台</h1>
    <span class="sub mono" id="endpoint"></span>
    <span class="spacer"></span>
    <button class="small" onclick="logout()">退出</button>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<script>
'use strict';
let KEY = sessionStorage.getItem('ph_key') || '';
let TAB = 'overview';

const TABS = [
  ['overview','总览'],['models','模型矩阵'],['groups','分组管理'],
  ['accounts','账号 / 熔断'],['config','配置'],
];

function authHeaders(){ return KEY ? {Authorization:'Bearer '+KEY} : {}; }
function toast(msg, err){
  const d=document.createElement('div');
  d.className='toast'+(err?' err':''); d.textContent=msg; document.body.appendChild(d);
  setTimeout(()=>d.remove(),3200);
}
async function api(path, opts={}){
  const res = await fetch(path, {headers:{'Content-Type':'application/json',...authHeaders()},...opts});
  if(res.status===401){ showKeybar(); throw new Error('Unauthorized'); }
  const body = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.error?.message || res.statusText);
  return body;
}
function saveKey(){ KEY=document.getElementById('keyinput').value.trim(); sessionStorage.setItem('ph_key',KEY); document.getElementById('keybar').classList.add('hidden'); render(); }
function logout(){ sessionStorage.removeItem('ph_key'); location.reload(); }
function showKeybar(){ document.getElementById('keybar').classList.remove('hidden'); }

document.getElementById('endpoint').textContent = location.origin;
document.getElementById('keyinput').addEventListener('keydown',e=>{ if(e.key==='Enter') saveKey(); });

/* ─────────── Tabs ─────────── */
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([id,name])=>
    `<div class="tab ${TAB===id?'active':''}" onclick="go('${id}')">${name}</div>`).join('');
}
function go(tab){ TAB=tab; renderTabs(); render(); }

/* ─────────── Overview ─────────── */
async function renderOverview(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card hint">加载中…</div>';
  try{
    const d = await api('/admin/api/overview');
    const days = d.usage?.byDay || [];
    const today = days.length ? days[days.length-1] : {requests:0,tokens:0};
    const totalReq = days.reduce((s,x)=>s+x.requests,0);
    const open = (d.breakers||[]).filter(b=>b.state==='open').length;
    el.innerHTML = `
      <div class="grid c4">
        <div class="card stat ok"><div class="v">${d.adapters.filter(a=>a.ready).length}/${d.adapters.length}</div><div class="k">适配器就绪</div></div>
        <div class="card stat"><div class="v">${today.requests||0}</div><div class="k">今日请求</div></div>
        <div class="card stat"><div class="v">${fmt((today.tokens||0))}</div><div class="k">今日 tokens</div></div>
        <div class="card stat ${open?'err':''}"><div class="v">${open}</div><div class="k">熔断中节点</div></div>
      </div>
      <div class="card"><h3>每日用量趋势（累计 ${fmt(totalReq)} 次请求）</h3><canvas id="chart"></canvas></div>
      <div class="card"><h3>适配器</h3><table><thead><tr><th>平台</th><th>就绪</th><th>账号</th><th>模型</th><th>说明</th></tr></thead><tbody>
        ${d.adapters.map(a=>`<tr><td class="mono">${a.id}</td>
          <td>${a.ready?'<span class="pill ok">ready</span>':'<span class="pill err">down</span>'}</td>
          <td>${a.accounts}</td><td>${a.models}</td><td class="hint">${a.error||'-'}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="card"><h3>熔断节点</h3><div id="bk"></div></div>`;
    drawChart(days);
    renderBreakers(d.breakers||[]);
  }catch(e){ el.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}
function renderBreakers(list){
  const el = document.getElementById('bk');
  if(!list.length){ el.innerHTML='<div class="hint">无熔断记录（一切正常）</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>节点</th><th>状态</th><th>连续失败</th><th>最近错误</th><th></th></tr></thead><tbody>
    ${list.map(b=>`<tr><td class="mono">${esc(b.key)}</td>
      <td><span class="pill ${b.state==='closed'?'ok':b.state==='open'?'err':'warn'}">${b.state}</span></td>
      <td>${b.consecutiveFailures}/${b.failureThreshold}</td>
      <td class="hint mono" style="max-width:420px;overflow:hidden;text-overflow:ellipsis">${esc(b.lastError||'-')}</td>
      <td><button class="small" onclick="resetOne('${esc(b.key)}')">复位</button></td></tr>`).join('')}
  </tbody></table>`;
}
async function resetOne(key){ try{ await api('/admin/api/breakers/reset',{method:'POST',body:JSON.stringify({key})}); toast('已复位'); render(); }catch(e){ toast(e.message,true); } }
async function resetAll(){ try{ await api('/admin/api/breakers/reset',{method:'POST'}); toast('已全部复位'); render(); }catch(e){ toast(e.message,true); } }

function drawChart(days){
  const c = document.getElementById('chart'); if(!c) return;
  const dpr = window.devicePixelRatio||1;
  c.width = c.offsetWidth*dpr; c.height = 160*dpr;
  const g = c.getContext('2d'); g.scale(dpr,dpr);
  const W=c.offsetWidth, H=160, pad=30;
  g.fillStyle='#1c2330'; g.fillRect(0,0,W,H);
  const data = days.slice(-14);
  const max = Math.max(1,...data.map(x=>x.requests));
  g.strokeStyle='#2d333b';
  for(let i=0;i<=4;i++){ const y=10+(H-40)*i/4; g.beginPath(); g.moveTo(pad,y); g.lineTo(W-8,y); g.stroke(); }
  if(data.length){
    const step=(W-pad-12)/Math.max(1,data.length-1);
    g.beginPath(); g.strokeStyle='#4f8cc9'; g.lineWidth=2;
    data.forEach((d,i)=>{ const x=pad+i*step, y=10+(H-40)*(1-d.requests/max); i?g.lineTo(x,y):g.moveTo(x,y); });
    g.stroke();
    g.fillStyle='#8b949e'; g.font='10px monospace';
    data.forEach((d,i)=>{ if(i%Math.ceil(data.length/7)===0) g.fillText(d.date.slice(5), pad+i*step-12, H-6); });
    g.fillStyle='#4f8cc9'; g.fillText('峰值 '+max, W-70, 14);
  } else { g.fillStyle='#6e7681'; g.font='12px sans-serif'; g.fillText('暂无用量数据', W/2-40, H/2); }
}

/* ─────────── Models matrix ─────────── */
async function renderModels(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card hint">加载中…</div>';
  try{
    const [mx, ms] = await Promise.all([api('/v1/models/matrix'), api('/v1/models')]);
    const groups = (ms.data||[]).filter(m=>m.owned_by==='proxyhub').map(m=>m.id);
    const families = mx.families||{};
    el.innerHTML = `
      <div class="card"><h3>虚拟分组（在 OpenAI 客户端 model 字段直接填写即可）</h3>
        ${groups.map(g=>`<span class="pill dim mono" style="margin:2px 6px 2px 0">${esc(g)}</span>`).join('')}
      </div>
      <div class="card"><h3>模型能力矩阵（按家族分组，共 ${Object.keys(families).length} 家族 / ${ms.data.length} 模型）</h3>
      ${Object.entries(families).map(([fam,v])=>`
        <div style="margin-bottom:12px"><b class="mono">${esc(fam)}</b>
        <table><thead><tr><th>平台</th><th>模型</th></tr></thead><tbody>
        ${Object.entries(v.providers).map(([ad,models])=>`<tr><td class="mono">${esc(ad)}</td><td class="mono">${models.map(esc).join(' · ')}</td></tr>`).join('')}
        </tbody></table></div>`).join('')}
      <p class="hint">${esc(mx.pricingNote||'')}</p></div>`;
  }catch(e){ el.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}

/* ─────────── Groups ─────────── */
async function renderGroups(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card hint">加载中…</div>';
  try{
    const d = await api('/admin/api/groups');
    el.innerHTML = `
      <div class="row"><button class="primary" onclick="editGroup()">＋ 新建分组</button>
        <span class="hint">分组即虚拟模型：客户端把 model 填为分组名，网关自动在候选链间熔断切换。</span></div>
      <div id="glist"></div>`;
    const list = d.groups||[];
    document.getElementById('glist').innerHTML = list.length ? `
      <table><thead><tr><th>分组</th><th>match 模式</th><th>平台优先级</th><th>候选数</th><th>说明</th><th></th></tr></thead><tbody>
      ${list.map(g=>`<tr>
        <td class="mono">${esc(g.name)}</td>
        <td class="mono">${g.match.map(esc).join('<br>')}</td>
        <td class="mono">${g.prefer.length?g.prefer.map(esc).join(' → '):'<span class="hint">默认</span>'}</td>
        <td>${g.candidates}${g.candidates>=50?'+' : ''}</td>
        <td class="hint">${esc(g.description)}</td>
        <td><button class="small" onclick="editGroup('${esc(g.name)}')">编辑</button>
            <button class="small danger" onclick="delGroup('${esc(g.name)}')">删除</button></td>
      </tr>`).join('')}</tbody></table>
      <div class="card"><h3>候选链示例（auto-flash 展开，按切换顺序）</h3>
        <div class="preview">${(list.find(g=>g.name==='auto-flash')?.preview||['-']).map(esc).join('  →  ')}</div></div>`
      : '<div class="card hint">尚无分组。默认分组（auto / auto-flash / auto-pro / auto-glm）仅在 config.json 未定义 groups 段时自动生效；删除后可手工重建。</div>';
  }catch(e){ el.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}
function editGroup(name){
  const g = name ? '' : '';
  const div = document.createElement('div'); div.className='modal';
  div.innerHTML = `<div class="box"><h2>${name?'编辑分组 '+esc(name):'新建分组'}</h2>
    <div class="field"><label>分组名（即客户端 model 字段值）</label><input id="gname" value="${esc(name||'auto-xxx')}" ${name?'disabled':''}></div>
    <div class="field"><label>match 模式（逗号分隔，* 通配，作用于当前生效模型表）</label><input id="gmatch" placeholder="*-flash, *-turbo"></div>
    <div class="field"><label>平台优先级（逗号分隔，留空按注册顺序）</label><input id="gprefer" placeholder="codebuddy, traecn, traework, qoder"></div>
    <div class="field"><label>说明</label><input id="gdesc" placeholder="速度优先：全部 flash 档模型自动切换"></div>
    <div class="row" style="justify-content:flex-end"><button onclick="this.closest('.modal').remove()">取消</button>
      <button class="primary" onclick="saveGroup('${esc(name||'')}')">保存</button></div></div>`;
  document.body.appendChild(div);
  if(name){
    api('/admin/api/groups').then(d=>{
      const g=(d.groups||[]).find(x=>x.name===name); if(!g) return;
      document.getElementById('gmatch').value=g.match.join(', ');
      document.getElementById('gprefer').value=g.prefer.join(', ');
      document.getElementById('gdesc').value=g.description||'';
    });
  }
}
async function saveGroup(name){
  const gname = name || document.getElementById('gname').value.trim();
  const match = document.getElementById('gmatch').value.split(',').map(s=>s.trim()).filter(Boolean);
  const prefer = document.getElementById('gprefer').value.split(',').map(s=>s.trim()).filter(Boolean);
  const description = document.getElementById('gdesc').value.trim();
  if(!match.length) return toast('match 模式不能为空',true);
  try{
    await api('/admin/api/groups/'+encodeURIComponent(gname),{method:'PUT',body:JSON.stringify({match,prefer,description})});
    toast('分组已保存（即时生效）'); document.querySelector('.modal')?.remove(); render();
  }catch(e){ toast(e.message,true); }
}
async function delGroup(name){
  if(!confirm(`确认删除分组 ${name}？使用该分组的客户端请求将回退到普通模型解析。`)) return;
  try{ await api('/admin/api/groups/'+encodeURIComponent(name),{method:'DELETE'}); toast('已删除'); render(); }
  catch(e){ toast(e.message,true); }
}

/* ─────────── Accounts & breakers ─────────── */
async function renderAccounts(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card hint">加载中…</div>';
  try{
    const d = await api('/admin/api/accounts');
    el.innerHTML = `
      <div class="row">
        <button class="primary" onclick="refreshAccounts()">重新扫描本机账号</button>
        <button class="danger" onclick="resetAll()">复位全部熔断</button>
        <span class="hint">多账号用于熔断后自动切号。同平台多账号高频并发可能触发平台风控，请自行评估。</span>
      </div>
      ${(d.accounts||[]).map(a=>`
        <div class="card"><h3>${esc(a.adapter)}（${a.accounts.length} 个账号）</h3>
        <table><thead><tr><th>账号</th><th>标签</th><th>来源</th><th>类型</th><th>熔断中</th></tr></thead><tbody>
        ${a.accounts.length? a.accounts.map(acc=>`<tr>
          <td class="mono">${esc(acc.accountId)}</td><td>${esc(acc.label)}</td>
          <td class="mono" style="max-width:380px;overflow:hidden;text-overflow:ellipsis">${esc(acc.source||'-')}</td>
          <td>${acc.discovered?'<span class="pill dim">自动发现</span>':'<span class="pill warn">手工录入</span>'}</td>
          <td>${acc.openBreakers?`<span class="pill err">${acc.openBreakers}</span>`:'<span class="pill ok">0</span>'}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="hint">未发现账号（凭据缺失或未登录对应客户端）</td></tr>'}
        </tbody></table></div>`).join('')}
      <div class="card"><h3>全部熔断节点</h3><div id="bk"></div></div>`;
    renderBreakers(d.breakers||[]);
  }catch(e){ el.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}
async function refreshAccounts(){
  try{ const d=await api('/admin/api/accounts/refresh',{method:'POST'});
    toast(`已扫描：共 ${d.total} 个账号（手工 ${d.manual} 个）`); render();
  }catch(e){ toast(e.message,true); }
}

/* ─────────── Config ─────────── */
async function renderConfig(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card hint">加载中…</div>';
  try{
    const d = await api('/admin/api/config');
    const c = d.config||{};
    el.innerHTML = `
      <div class="card"><h3>基础配置（保存即热更新，写回 config.json）</h3>
        <div class="form2">
          <div class="field"><label>端口（需重启）</label><input id="c_port" value="${c.port??8265}"></div>
          <div class="field"><label>proxy key（需重启，空=本地开放）</label><input id="c_proxyKey" value="${esc(c.proxyKey||'')}"></div>
          <div class="field"><label>上游超时 ms</label><input id="c_timeoutMs" value="${c.timeoutMs??120000}"></div>
          <div class="field"><label>适配器开关（需重启）</label>
            ${['codebuddy','traecn','traework','qoder'].map(a=>`
              <label style="margin-right:10px"><input type="checkbox" id="c_ad_${a}" ${c.adapters?.[a]!==false?'checked':''}> ${a}</label>`).join('')}
          </div>
        </div></div>
      <div class="card"><h3>熔断参数（热更新）</h3><div class="form2">
        <div class="field"><label>连续失败阈值</label><input id="c_threshold" value="${c.circuitBreaker?.failureThreshold??2}"></div>
        <div class="field"><label>冷却秒数</label><input id="c_cooldown" value="${c.circuitBreaker?.cooldownSeconds??60}"></div>
        <div class="field"><label>半开探测</label><label><input type="checkbox" id="c_probe" ${c.circuitBreaker?.halfOpenProbe!==false?'checked':''}> 冷却期满放行一个探测请求</label></div>
      </div></div>
      <div class="card"><h3>管理页（热更新）</h3><div class="form2">
        <div class="field"><label>启用 /admin</label><label><input type="checkbox" id="c_adminOn" ${c.admin?.enabled!==false?'checked':''}> 允许访问管理页</label></div>
        <div class="field"><label>切换标记头</label><label><input type="checkbox" id="c_foHeader" ${c.admin?.failoverHeader!==false?'checked':''}> 响应头 X-ProxyHub-Failover 标注切换路径</label></div>
      </div></div>
      <div class="row"><button class="primary" onclick="saveConfig()">保存配置</button>
        <span class="hint">配置文件：<code>${esc(d.path)}</code></span></div>
      <div class="card"><h3>当前完整配置（只读快照）</h3><pre id="rawcfg"></pre></div>`;
    document.getElementById('rawcfg').textContent = JSON.stringify(c,null,2);
  }catch(e){ el.innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}
async function saveConfig(){
  const body = {
    port: +document.getElementById('c_port').value||8265,
    proxyKey: document.getElementById('c_proxyKey').value,
    timeoutMs: +document.getElementById('c_timeoutMs').value||120000,
    adapters: Object.fromEntries(['codebuddy','traecn','traework','qoder'].map(a=>[a,document.getElementById('c_ad_'+a).checked])),
    circuitBreaker: {
      failureThreshold: +document.getElementById('c_threshold').value||2,
      cooldownSeconds: +document.getElementById('c_cooldown').value||60,
      halfOpenProbe: document.getElementById('c_probe').checked,
    },
    admin: {
      enabled: document.getElementById('c_adminOn').checked,
      failoverHeader: document.getElementById('c_foHeader').checked,
    },
  };
  try{
    await api('/admin/api/config',{method:'PUT',body:JSON.stringify(body)});
    toast('配置已保存并热更新（结构性项需重启）'); render();
  }catch(e){ toast(e.message,true); }
}

/* ─────────── helpers ─────────── */
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n){ return n>=1e6?(n/1e6).toFixed(1)+'M' : n>=1e3?(n/1e3).toFixed(1)+'k' : String(n); }

async function render(){
  if(TAB==='overview') await renderOverview();
  else if(TAB==='models') await renderModels();
  else if(TAB==='groups') await renderGroups();
  else if(TAB==='accounts') await renderAccounts();
  else if(TAB==='config') await renderConfig();
}

/* ─────────── boot ─────────── */
renderTabs();
(async()=>{
  try{ await api('/health'); render(); }
  catch(e){ showKeybar(); }
})();
</script>
</body>
</html>
